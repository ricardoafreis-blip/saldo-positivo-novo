name: Fechar o dia

# Apura as carteiras do último pregão com cotação.
#
# SETE TENTATIVAS POR DIA, e isso é de propósito: a cotação depende do
# MT5 estar aberto, o que nem sempre acontece às 18h. O robô recusa
# apurar duas vezes o mesmo pregão — se já está fechado, ele diz e sai
# em segundos. Então tentar de novo não custa nada e não estraga nada.
#
# Se nenhuma tentativa pegar, o dia fica pendente até você abrir o MT5:
# o robô prefere não apurar a apurar com dado furado.
#
# O cron do GitHub é em UTC. Brasília é UTC−3.
# E ele costuma atrasar de 5 a 20 minutos — com sete tentativas isso
# deixa de importar.

on:
  schedule:
    - cron: "22 22 * * 1-5"       # 19h22
    - cron: "37 1 * * 2-6"        # 22h37
    - cron: "7,52 6 * * 2-6"      # 3h07 e 3h52
    - cron: "22,47 7 * * 2-6"     # 4h22 e 4h47
    - cron: "12 8 * * 2-6"        # 5h12
  workflow_dispatch:
jobs:
  fechar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node robo/robo.mjs dia
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY:       ${{ secrets.RESEND_API_KEY }}
          EMAIL_DE:             ${{ secrets.EMAIL_DE }}
