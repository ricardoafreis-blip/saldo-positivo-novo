name: Cotação ao vivo

# De hora em hora durante o pregão. O cron do GitHub é UTC e
# atrasa alguns minutos com frequência — 13h às 21h UTC cobre das 10h
# às 18h de Brasília, com folga nas pontas.
on:
  schedule:
    - cron: "0 13-21 * * 1-5"
  workflow_dispatch:

jobs:
  viva:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Buscar cotação e gravar a foto
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
        run: node robo/intradia.mjs
