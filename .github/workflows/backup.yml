name: Backup

# ESTE REPOSITÓRIO É PÚBLICO.
# Por isso os DADOS nunca são gravados dentro dele: eles têm e-mail,
# telefone e os pesos das carteiras, que é justamente o que o assinante
# paga para ver. Os dados viram um arquivo privado do Actions.
# A ESTRUTURA (tabelas, views, funções, gatilhos, RLS) vai para a pasta
# sql/, essa sim no repositório: não tem segredo e é a única cópia que
# existe fora do banco.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  salvar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar o cliente do Postgres
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-16

      - name: Baixar estrutura e dados
        env:
          URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p sql privado
          pg_dump "$URL" --schema-only --no-owner --no-privileges \
                  --schema=public > sql/estrutura.sql
          pg_dump "$URL" --data-only --no-owner --column-inserts \
                  --schema=public > privado/dados.sql
          psql "$URL" -A -F' | ' -c "
            select relname as tabela, n_live_tup as linhas
              from pg_stat_user_tables order by relname;" > sql/resumo.txt
          ls -lh sql/ privado/

      - name: Guardar os dados como arquivo privado
        uses: actions/upload-artifact@v4
        with:
          name: dados-${{ github.run_number }}
          path: privado/dados.sql
          retention-days: 30

      - name: Guardar a estrutura no repositório
        run: |
          rm -rf privado
          git config user.name  "robô de backup"
          git config user.email "acoes@users.noreply.github.com"
          git add sql/estrutura.sql sql/resumo.txt
          if git diff --staged --quiet; then
            echo "a estrutura não mudou desde o último backup"
          else
            git commit -m "backup da estrutura $(date -u +%Y-%m-%d)"
            git push
          fi
