name: Backup

# ⚠️ ESTE REPOSITÓRIO É PÚBLICO.
#
# Por isso os DADOS nunca são gravados dentro dele: eles têm e-mail,
# telefone e os pesos das carteiras, que é justamente o que o assinante
# paga para ver. Os dados viram um arquivo privado do Actions, que só
# quem tem acesso ao repositório consegue baixar.
#
# A ESTRUTURA (tabelas, views, funções, gatilhos, políticas de RLS) vai
# para a pasta sql/, essa sim dentro do repositório: não tem segredo
# nenhum e é a única cópia que existe fora do banco. Se o projeto do
# Supabase sumir, é ela que permite reconstruir tudo.
#
# Roda toda madrugada e também pelo botão Run workflow.

on:
  schedule:
    - cron: "0 6 * * *"        # 3h da manhã em Brasília
  workflow_dispatch:

permissions:
  contents: write

jobs:
  salvar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar o cliente do Postgres 17
        run: |
          # O banco do Supabase é Postgres 17 e o pg_dump se recusa a
          # exportar servidor mais novo que ele. O Ubuntu do runner só
          # traz o 16, então o 17 vem do repositório oficial.
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17

      - name: Baixar estrutura e dados
        env:
          URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # Chamar pelo CAMINHO COMPLETO: o Ubuntu mantém o 16 e o 17
          # instalados lado a lado, e o "pg_dump" solto aponta para o
          # antigo — foi assim que a primeira tentativa falhou mesmo
          # depois de instalar o 17.
          PGB=/usr/lib/postgresql/17/bin
          $PGB/pg_dump --version
          mkdir -p sql privado
          $PGB/pg_dump "$URL" --schema-only --no-owner --no-privileges \
                  --schema=public > sql/estrutura.sql
          $PGB/pg_dump "$URL" --data-only --no-owner --column-inserts \
                  --schema=public > privado/dados.sql
          $PGB/psql "$URL" -A -F' | ' -c "
            select relname as tabela, n_live_tup as linhas
              from pg_stat_user_tables order by relname;" > sql/resumo.txt
          ls -lh sql/ privado/

      # Os dados ficam aqui, fora do repositório público. Para baixar:
      # Actions → a execução → seção Artifacts, no rodapé da página.
      - name: Guardar os dados como arquivo privado
        uses: actions/upload-artifact@v4
        with:
          name: dados-${{ github.run_number }}
          path: privado/dados.sql
          retention-days: 30

      - name: Guardar a estrutura no repositório
        run: |
          rm -rf privado
          git config user.name  "robô de backup"
          git config user.email "acoes@users.noreply.github.com"
          git add sql/estrutura.sql sql/resumo.txt
          if git diff --staged --quiet; then
            echo "a estrutura não mudou desde o último backup"
          else
            git commit -m "backup da estrutura $(date -u +%Y-%m-%d)"
            git push
          fi
