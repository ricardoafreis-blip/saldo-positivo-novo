<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saldo Positivo — carteiras de estudo</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ══ paleta: azul em camadas + dourado escasso ══════════════════
   Verde e vermelho são DADO, nunca enfeite. O ouro marca só duas
   coisas: o lacre e o que está ativo. Se estiver em tudo, vira cassino. */
:root{
  --papel:#0A1120;      /* fundo — azul quase preto */
  --p2:#101B2E;         /* superfície elevada */
  --p3:#16243B;         /* hover / cartão */
  --linha:#1F3049;      /* divisória */
  --linha2:#2B4162;     /* divisória mais visível */
  --tinta:#E9EEF7;      /* texto principal */
  --t2:#9AAEC8;         /* secundário */
  --graf:#7189AE;       /* terciário */
  --dest:#16243B;
  --lacre:#C9A227;      /* ouro */
  --ouro2:#E3C45C;      /* ouro claro */
  --ouro-fraco:rgba(201,162,39,.12);
  --alta:#3DD68C;
  --baixa:#F2685F;
  --alta-bg:rgba(61,214,140,.75);
  --baixa-bg:rgba(242,104,95,.75);
}
*{box-sizing:border-box}
body{margin:0;background:var(--papel);color:var(--tinta);
  font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3{font-family:Newsreader,Georgia,serif;font-weight:500;letter-spacing:-.015em;margin:0;line-height:1.14}
a{color:inherit;text-decoration:none}
.alta{color:var(--alta)}.baixa{color:var(--baixa)}
.w{max-width:1120px;margin:0 auto;padding:0 26px}
button,input,select,textarea{font-family:inherit;font-size:inherit}
button{cursor:pointer;border:none;background:none;color:inherit}
::selection{background:var(--lacre);color:#0A1120}

/* faixa de aviso */
.aviso{background:#060C17;color:var(--t2);font-size:11.5px;padding:9px 0;
  border-bottom:1px solid var(--linha)}
.aviso b{color:var(--tinta);font-weight:500}

/* topo */
header{border-bottom:1px solid var(--linha);background:linear-gradient(180deg,#0C1425,#0A1120)}

nav{display:flex;align-items:center;gap:30px;padding:20px 0;flex-wrap:wrap}
nav .marca{font-family:Newsreader,serif;font-weight:500;font-size:21px;letter-spacing:-.02em;color:var(--tinta)}
nav a,nav button.lnk{font-size:13px;color:var(--t2);background:none;transition:color .15s}
nav a:hover,nav button.lnk:hover{color:var(--ouro2)}
nav .marca:hover{color:var(--tinta)}
nav .dir{margin-left:auto;display:flex;gap:14px;align-items:center;font-size:13px}
nav .bloco{display:flex;gap:16px;align-items:center}
.pill{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;padding:3px 9px;
  border:1px solid var(--lacre);color:var(--ouro2);border-radius:99px;background:var(--ouro-fraco)}

/* botões */
.bt{display:inline-block;padding:10px 18px;border:1px solid var(--linha2);border-radius:3px;
  font-size:13.5px;font-weight:500;text-align:center;color:var(--tinta);transition:.16s}
.bt:hover{background:var(--p3);border-color:var(--graf)}
.bt.cheio{background:var(--tinta);color:#0A1120;border-color:var(--tinta)}
.bt.cheio:hover{background:#fff;border-color:#fff}
.bt.lacre{background:var(--lacre);color:#0A1120;border-color:var(--lacre);font-weight:600}
.bt.lacre:hover{background:var(--ouro2);border-color:var(--ouro2)}
.bt:disabled{opacity:.4;cursor:default}

.msg{padding:12px 16px;border-left:2px solid var(--lacre);background:var(--ouro-fraco);
  margin:16px 0;font-size:13px;color:var(--tinta);border-radius:0 3px 3px 0}
.msg.erro{border-left-color:var(--baixa);background:rgba(242,104,95,.1)}

/* superfícies — elevação em vez de contorno */
.card{background:var(--p2);border:1px solid var(--linha);padding:22px 24px;border-radius:4px}

/* tabelas — limpas, sem grade pesada */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:9.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--graf);
  text-align:left;padding:0 0 11px;font-weight:500;border-bottom:1px solid var(--linha2)}
td{padding:13px 0;border-bottom:1px solid var(--linha)}
th.d,td.d{text-align:right}
tr.clicavel{transition:background .14s}
tr.clicavel:hover{background:var(--p2);cursor:pointer}
tr.clicavel:hover td:first-child{box-shadow:inset 2px 0 0 var(--lacre)}

/* formulário */
label{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.13em;
  color:var(--graf);margin:0 0 7px}
input,select,textarea{width:100%;padding:11px 13px;border:1px solid var(--linha2);
  background:var(--papel);color:var(--tinta);margin-bottom:16px;border-radius:3px;transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--lacre)}
textarea{font-family:'IBM Plex Mono',monospace;line-height:1.8;resize:vertical}
input[readonly]{color:var(--t2)}

.tag{font-size:9px;letter-spacing:.11em;text-transform:uppercase;padding:3px 8px;
  border:1px solid var(--linha2);border-radius:99px;color:var(--t2);white-space:nowrap;display:inline-block}
.tag.al{color:var(--ouro2);border-color:var(--lacre);background:var(--ouro-fraco)}

/* números em destaque — sem caixinhas */
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));
  gap:1px;background:var(--linha);border:1px solid var(--linha);margin:22px 0;border-radius:4px;overflow:hidden}
.cel{background:var(--p2);padding:15px 16px}
.cel .v{font-family:'IBM Plex Mono';font-size:20px;font-weight:500;letter-spacing:-.02em}
.cel .k{font-size:9px;text-transform:uppercase;letter-spacing:.13em;color:var(--graf);margin-top:3px}

/* o lacre — momento de marca */
.trancado{position:relative;padding:52px 24px;background:var(--p2);text-align:center;
  overflow:hidden;border:1px solid var(--linha);border-radius:4px}
.trancado::before{content:'';position:absolute;inset:0;opacity:.6;
  background:repeating-linear-gradient(-45deg,transparent 0 13px,rgba(201,162,39,.055) 13px 14px)}
.trancado>*{position:relative}
.selo{width:76px;height:76px;margin:0 auto 20px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,var(--ouro2),var(--lacre) 58%,#8A6D18);
  display:grid;place-items:center;color:#0A1120;font-size:29px;
  box-shadow:0 0 0 1px rgba(227,196,92,.35),0 0 34px rgba(201,162,39,.22)}

.duplo{display:grid;grid-template-columns:1fr 1fr;gap:26px}
@media(max-width:760px){.duplo{grid-template-columns:1fr}}

.barra{height:26px;display:flex;background:var(--papel);border:1px solid var(--linha2);border-radius:3px;overflow:hidden}
.barra{position:relative}
.barra span{display:block;height:100%}
.marca100{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--lacre);
  box-shadow:0 0 5px rgba(201,162,39,.55)}

footer{border-top:1px solid var(--linha);margin-top:64px;padding:26px 0 52px;
  font-size:11.5px;color:var(--graf)}
.carreg{text-align:center;padding:54px;color:var(--graf);font-size:13px}

.chamada{display:flex;gap:22px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  background:linear-gradient(135deg,var(--p2),#0E1929);border:1px solid var(--linha2);
  border-left:3px solid var(--lacre);padding:22px 24px;margin:22px 0;border-radius:4px}
.chips{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin:18px 0 12px}
.chip{padding:3px 0;font-size:12.5px;color:var(--t2);
  border-bottom:1.5px solid transparent;transition:.15s}
.chip:hover{color:var(--tinta)}
.chip.on{color:var(--ouro2);border-bottom-color:var(--lacre)}
.chip .n{color:var(--graf);font-size:11px;margin-left:3px}
.divisor{width:1px;height:13px;background:var(--linha2);flex:none}

/* posição no ranking em ouro */
.pos{font-family:'IBM Plex Mono';font-size:12px;color:var(--graf);letter-spacing:.02em}
.meta{font-size:11.5px;color:var(--graf);margin-top:3px}
.nulo{color:var(--graf)}

/* faixa de cotacao — le a view faixa_cotacao */
.faixa{border-bottom:1px solid var(--linha);background:#070E1B;display:none}
.faixa .in{display:flex;align-items:center;gap:14px;padding:8px 0;
  font-size:11.5px;white-space:nowrap;overflow-x:auto;scrollbar-width:none}
.faixa .in::-webkit-scrollbar{display:none}
.faixa .tk{color:var(--graf);letter-spacing:.04em}
.faixa .sep{width:1px;height:11px;background:var(--linha2);flex:none}
.faixa .hr{margin-left:auto;color:var(--graf);padding-left:18px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="aviso"><div class="w"><b>Caderno de estudo.</b>
Nada aqui é recomendação — cada carteira é anotação pessoal de quem publica.</div></div>

<header><div class="w"><nav>
  <a href="#/" class="marca" style="margin-right:8px">Saldo Positivo</a>
  <span class="bloco"><a href="#/">Ranking</a><span id="navPub"></span></span>
  <span class="divisor"></span>
  <span class="bloco"><a href="#/apostar">Palpitar</a><a href="#/placar">Placar</a><a href="#/duelo">Duelo</a></span>

</nav></div></header>

<div class="faixa" id="faixa"></div>

<main class="w" id="app"><div class="carreg">carregando…</div></main>

<footer class="w">A rentabilidade começa no dia em que a carteira é publicada — não há histórico retroativo.
Cada carteira é anotação pessoal de quem a publica.</footer>

<script type="module">
// ═══════════════════════════════════════════════════════════════
//  CONFIGURAÇÃO — troque só a linha da CHAVE pela sua
// ═══════════════════════════════════════════════════════════════
const URL   = "https://ixoucxcbategvjfdgmti.supabase.co";
const CHAVE = "sb_publishable_p45Gm13xcRkIAMhR_tfkrg_LJHOGTja";
// ═══════════════════════════════════════════════════════════════

import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const sb = createClient(URL, CHAVE);

const CDI_ANO = 0.105;

let eu = null;              // perfil logado
const $ = s => document.querySelector(s);
const app = () => $("#app");

const pct = (v,c=2) => v==null ? "—" : (v>=0?"+":"") + (v*100).toFixed(c).replace(".",",") + "%";
const n2  = (v,c=2) => v==null ? "—" : v.toFixed(c).replace(".",",");
const esc = s => String(s??"").replace(/[<>&"]/g, m => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[m]));
const cor = v => v>=0 ? "alta" : "baixa";

function aviso(t, erro){ return `<div class="msg${erro?" erro":""}">${esc(t)}</div>`; }
// As quatro classes. Escolhidas no nascimento da carteira e imutáveis:
// trocar de classe depois de ver o resultado seria escolher a régua com
// o jogo já jogado. O banco recusa declaração que viole a classe
// (valida_classe, banco11) — aqui é só rótulo e filtro.
// A chave 'diversificada' virou a classe Comprada e 'all_in' foi
// aposentada (as carteiras existentes foram encerradas). Os limites de
// 100% e 200% são sempre INCLUSIVE.
const CLASSE = {
  diversificada:     { nome:"Comprada",
    regra:"Só compra, exatamente 10 papéis. A soma dos pesos pode ir até 100% do dinheiro." },
  sessenta_quarenta: { nome:"60/40",
    regra:"Só compra, com 50% a 80% do dinheiro em renda fixa e o resto em ações — 100% na montagem." },
  long_short:        { nome:"Long × short",
    regra:"Compra e venda ao mesmo tempo. A soma vai até 200% e a diferença entre elas até 100%." },
  vendida:           { nome:"Vendida",
    regra:"Só venda a descoberto, até 100% do patrimônio. A carteira encerra se perder tudo." },
};

// A view ranking não tem a coluna classe, então vem de carteira_classe.
let CACHE_CLASSE = null;
async function classes(){
  if(CACHE_CLASSE) return CACHE_CLASSE;
  const { data } = await sb.from("carteira_classe").select("id,classe,criada_em,autor");
  CACHE_CLASSE = {}; (data||[]).forEach(x=> CACHE_CLASSE[x.id] = x);
  return CACHE_CLASSE;
}

// data de hoje no fuso de São Paulo, igual ao hoje_br() do banco
const HOJE_BR = () => new Date().toLocaleDateString("sv-SE", { timeZone:"America/Sao_Paulo" });

// ── quando a cotação foi e quando será ──
// O robô roda de hora em hora, na virada, das 10h às 18h em dia útil.
// O cron do GitHub costuma atrasar alguns minutos, então a previsão é
// "por volta de", nunca cravada.
const partesBR = d => {
  const f = new Intl.DateTimeFormat("pt-BR", { timeZone:"America/Sao_Paulo",
    hour:"2-digit", minute:"2-digit", weekday:"short", hour12:false }).formatToParts(d);
  const g = t => f.find(p=>p.type===t)?.value || "";
  return { hora:Number(g("hour")), minuto:Number(g("minute")), dia:g("weekday") };
};

function haQuantoTempo(iso){
  const min = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));
  if(min < 1)  return "agora mesmo";
  if(min === 1) return "há 1 minuto";
  if(min < 60) return `há ${min} minutos`;
  const h = Math.floor(min/60);
  return h === 1 ? "há 1 hora" : `há ${h} horas`;
}

function proximaCotacao(){
  const p = partesBR(new Date());
  const fimDeSemana = /^(sáb|dom)/i.test(p.dia);
  if(fimDeSemana || p.hora < 10 || p.hora >= 18) return null;   // fora do pregão
  const faltam = 60 - p.minuto;
  return faltam <= 1 ? "a próxima sai a qualquer momento"
                     : `a próxima por volta de ${String((p.hora+1)%24).padStart(2,"0")}:00, em ${faltam} min`;
}

function tags(c){
  const t=[];
  // Sem classe E sem posicao adotada nao da para deduzir nada: chutar
  // "so comprada" para uma long & short recem-criada e pior que calar.
  if(c.classe && CLASSE[c.classe]) t.push(CLASSE[c.classe].nome);
  else if(!c.bruta) return "";
  else if(c.liquida>=c.bruta-0.01) t.push("só comprada");
  else if(c.liquida<=-c.bruta+0.01) t.push("só vendida");
  else t.push("long &amp; short");
  if(c.bruta>105) t.push(`alavancada ${n2(c.bruta/100,1)}x`);
  if(c.caixa>1)       t.push(`${n2(c.caixa,0)}% em caixa`);
  else if(c.caixa<-1) t.push(`${n2(-c.caixa,0)}% de margem`);
  // Texto miudo, nao pilula: metadado nao pode competir com o numero.
  return t.join(" · ");
}

// ═══════════════════════════════════════════ grade de posições
let UNIVERSO=null, UNISET=null;
async function universo(){
  if(UNIVERSO) return UNIVERSO;
  const { data } = await sb.from("universo").select("ativo").order("ativo");
  UNIVERSO=(data||[]).map(x=>x.ativo); UNISET=new Set(UNIVERSO);
  return UNIVERSO;
}
function gradeHTML(){
  return `
  <datalist id="uni">${(UNIVERSO||[]).map(a=>`<option value="${a}">`).join("")}</datalist>
  <table style="width:100%;border-collapse:collapse">
    <thead><tr>
      <th style="text-align:left;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--graf);padding-bottom:4px">Ativo</th>
      <th style="text-align:right;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--graf);padding-bottom:4px;width:82px">%</th>
      <th style="text-align:left;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--graf);padding-bottom:4px;width:104px">Posição</th>
      <th style="width:30px"></th>
    </tr></thead><tbody id="linhas"></tbody>
  </table>
  <button type="button" class="bt" id="btAdd" style="margin-top:9px">Adicionar</button>
  <div id="resumo" style="margin-top:11px;font-size:12px;color:var(--t2)"></div>`;
}
// Qual classe a grade esta montando. Define quais lados o select oferece:
// All in e Diversificada so compram; Vendida so vende. Antes a tela
// aceitava qualquer lado e quem recusava era o banco, depois do clique.
let CLASSE_ATUAL = "";
// Na 60/40 a grade vale DENTRO da parte de acoes e soma 100%. Quem
// converte para % do dinheiro e o site, na hora de salvar. So a tela de
// criar tem esse campo; na de editar a grade continua em % do dinheiro.
const modoSleeve = () => CLASSE_ATUAL === "sessenta_quarenta" && !!document.querySelector("#rendaFixa");
function rendaFixaAtual(){
  const el = document.querySelector("#rendaFixa");
  return el ? Math.min(80, Math.max(50, Math.round(Number(el.value) || 60))) : 60;
}
// Converte % da parte de acoes em % do dinheiro, com sobra distribuida
// para as maiores posicoes — assim a soma bate exata, sem casa decimal.
function converterSleeve(pesos, rf){
  const parte = 100 - rf;
  const ent = Object.entries(pesos);
  const exato = ent.map(([a,p]) => [a, p * parte / 100]);
  const base  = exato.map(([a,v]) => [a, Math.floor(v)]);
  let sobra = parte - base.reduce((s,[,v]) => s + v, 0);
  exato.map((x,i) => [i, x[1] - Math.floor(x[1])])
       .sort((x,y) => y[1] - x[1])
       .forEach(([i]) => { if(sobra > 0){ base[i][1] += 1; sobra--; } });
  return Object.fromEntries(base);
}
function ladosDaClasse(k){
  if(k === "diversificada" || k === "sessenta_quarenta") return "C";
  if(k === "vendida") return "V";
  return "CV";
}
function opcoesLado(lado){
  const ok = ladosDaClasse(CLASSE_ATUAL);
  const sel = ok.includes(lado) ? lado : ok[0];
  let h = "";
  if(ok.includes("C")) h += `<option value="C"${sel==="C"?" selected":""}>compra</option>`;
  if(ok.includes("V")) h += `<option value="V"${sel==="V"?" selected":""}>venda</option>`;
  return h;
}
function aplicarLados(){
  document.querySelectorAll("#linhas .pl").forEach(sel=>{
    sel.innerHTML = opcoesLado(sel.value);
  });
  resumoGrade();
}
function linhaHTML(a,p,lado){
  return `<tr>
    <td style="padding:3px 7px 3px 0"><input list="uni" class="pa" value="${a||""}"
      placeholder="PETR4" maxlength="6" style="width:100%;text-transform:uppercase;margin:0"></td>
    <td style="padding:3px 7px"><input class="pp" type="number" step="1" min="0" max="200"
      value="${p??""}" style="width:100%;text-align:right;margin:0"></td>
    <td style="padding:3px 7px"><select class="pl" style="width:100%;margin:0">${opcoesLado(lado)}</select></td>
    <td style="padding:3px 0"><button type="button" class="px bt" title="remover"
      style="padding:4px 9px;margin:0">×</button></td></tr>`;
}
// Codigo repetido soma num so ativo. Isso e util (da para lancar duas
// pernas do mesmo papel), mas confunde a contagem: dez linhas com um
// codigo repetido sao nove papeis. LINHAS_REPETIDAS guarda quais foram,
// para o conferidor avisar em vez de a pessoa recontar na mao.
let LINHAS_REPETIDAS = [];
function lerGrade(){
  const pesos={}, vezes={};
  document.querySelectorAll("#linhas tr").forEach(tr=>{
    const a=(tr.querySelector(".pa").value||"").trim().toUpperCase();
    // peso e sempre inteiro: 1% de precisao ja e mais fino do que
    // qualquer carteira de estudo consegue sustentar na pratica
    let w=Math.round(parseFloat(String(tr.querySelector(".pp").value||"").replace(",",".")));
    if(!a||!isFinite(w)||w===0) return;
    w = tr.querySelector(".pl").value==="V" ? -Math.abs(w) : Math.abs(w);
    pesos[a]=(pesos[a]||0)+w;
    vezes[a]=(vezes[a]||0)+1;
  });
  LINHAS_REPETIDAS = Object.keys(vezes).filter(a=>vezes[a]>1);
  return pesos;
}
// O que falta para a carteira caber na classe escolhida. Devolve lista
// de pendencias em portugues — vazia quer dizer que passa.
// ATENCAO: estas regras sao a leitura do texto de CLASSE. Quem manda de
// verdade e valida_classe() no banco. Se as duas discordarem, o banco
// ganha e esta funcao precisa ser corrigida para bater com ele.
function pendenciasClasse(k, pesos){
  if(!k || !CLASSE[k]) return [];
  const v = Object.values(pesos), n = v.length;
  const bruta = v.reduce((a,b)=>a+Math.abs(b),0);
  const liq   = v.reduce((a,b)=>a+b,0);
  const temC = v.some(x=>x>0), temV = v.some(x=>x<0);
  const f = [];
  if(!n) return ["nenhuma posição preenchida"];
  if(LINHAS_REPETIDAS.length)
    f.push(`${LINHAS_REPETIDAS.join(" e ")} ${LINHAS_REPETIDAS.length>1?"aparecem":"aparece"}`
         + ` em mais de uma linha e ${LINHAS_REPETIDAS.length>1?"contam":"conta"} como um papel só`);

  if(k==="diversificada"){                       // Comprada
    if(temV)   f.push("Comprada não aceita venda");
    if(n!==10) f.push(`${n} ${n===1?"papel":"papéis"} — Comprada exige exatamente 10`);
    if(bruta>100) f.push(`soma ${Math.round(bruta)}% — o limite é 100%`);
  }
  if(k==="sessenta_quarenta"){
    if(temV) f.push("60/40 não aceita venda");
    if(modoSleeve()){
      const rf = rendaFixaAtual();
      if(Math.round(bruta) !== 100)
        f.push(`a parte de ações soma ${Math.round(bruta)}% — precisa somar 100%`);
      else if(Object.values(converterSleeve(pesos, rf)).some(v => v === 0))
        f.push("algum papel ficou pequeno demais e zerou na conversão — use menos papéis ou pesos maiores");
    } else {
      const rf = 100 - bruta;                    // tela de editar: % do dinheiro
      if(bruta>100) f.push(`soma ${Math.round(bruta)}% — o limite é 100%`);
      else if(rf<50 || rf>80)
        f.push(`${Math.round(rf)}% em renda fixa — a faixa é de 50% a 80%`);
    }
  }
  if(k==="long_short"){
    if(!(temC && temV)) f.push("Long × short exige ao menos uma compra e uma venda");
    if(bruta>200) f.push(`soma ${Math.round(bruta)}% — o teto é 200%`);
    if(Math.abs(liq)>100)
      f.push(`diferença ${Math.round(Math.abs(liq))}% — o limite é 100%`);
  }
  if(k==="vendida"){
    if(temC) f.push("Vendida não aceita compra");
    if(bruta>100) f.push(`soma ${Math.round(bruta)}% — o limite é 100% do patrimônio`);
  }
  return f;
}
function resumoGrade(){

  const bruta=v.reduce((a,b)=>a+Math.abs(b),0), liq=v.reduce((a,b)=>a+b,0);
  const falta = pendenciasClasse(CLASSE_ATUAL, pesos);
  const nome = CLASSE[CLASSE_ATUAL]?.nome;

// ═══════════════════════════════════════════ métricas
function metricas(serie){
  if(!serie || !serie.length) return {dias:0,acum:0,vol:null,sharpe:null,dd:0,hoje:0};
  const r = serie.map(x=>x.retorno), n = r.length;
  const acum = serie[serie.length-1].indice/100 - 1;
  let vol=null, sharpe=null;
  // Sharpe só com 20 pregões. Com 5 dias, qualquer sequência de sorte
  // vira número grande e o ranking premia quem acabou de chegar.
  if(n>=20){
    const m = r.reduce((a,b)=>a+b,0)/n;
    vol = Math.sqrt(r.reduce((a,b)=>a+(b-m)**2,0)/(n-1))*Math.sqrt(252);
    if(vol>0){
      // Média aritmética × 252, não (1+acum)^(252/n). A versão composta
      // extrapola: +9% em 21 dias virava +183% ao ano e o Sharpe ia a 13.
      const ann = m * 252;
      // Encolhimento por histórico curto, mesma ideia do termômetro de
      // palpites: n/(n+40). Com 21 dias vale 34% do valor cheio; com um
      // ano, 86%. Não é o Sharpe de livro — é Sharpe para ordenar, que
      // não pode deixar três semanas boas passarem na frente de um ano.
      sharpe = ((ann - CDI_ANO) / vol) * (n / (n + 40));
    }
  }
  // O pico parte de 100, que e a base do indice. Comecando em zero, o
  // primeiro pregao virava o proprio pico e a carteira nunca aparecia
  // abaixo dele: quem caiu no primeiro dia marcava drawdown 0.
  let pico=100, dd=0;
  serie.forEach(x=>{ pico=Math.max(pico,x.indice); dd=Math.min(dd, x.indice/pico-1); });
  return {dias:n, acum, vol, sharpe, dd, hoje:r[n-1]};
}

// ═══════════════════════════════════════════ extrato
// Compara cada declaracao com a anterior e descreve em portugues o que
// mudou. Nao precisa de tabela nova: a posicao ja guarda toda declaracao
// separada por valida_de — o historico sempre esteve la, so nao aparecia.
function montarExtrato(todas){
  const porData = {};
  (todas||[]).forEach(x => { (porData[x.valida_de] ||= {})[x.ativo] = x.peso; });
  const datas = Object.keys(porData).sort();

  const tam  = v => n2(Math.abs(v),0) + "%";
  const lado = v => v < 0 ? "vendido" : "comprado";

  const eventos = datas.map((d,i) => {
    const agora = porData[d], antes = i ? porData[datas[i-1]] : null;
    const acoes = [];

    if(!antes){
      Object.entries(agora)
        .sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]))
        .forEach(([a,v]) => acoes.push(`abriu ${a} ${lado(v)} ${tam(v)}`));
      return { data:d, abertura:true, acoes };
    }

    const ativos = [...new Set([...Object.keys(antes), ...Object.keys(agora)])].sort();
    ativos.forEach(a => {
      const de = antes[a], para = agora[a];
      if(de == null)        acoes.push(`entrou ${a} ${lado(para)} ${tam(para)}`);
      else if(para == null) acoes.push(`saiu ${a}`);
      else if(Math.sign(de) !== Math.sign(para))
        acoes.push(`${a} virou de ${lado(de)} para ${lado(para)} ${tam(para)}`);
      else if(Math.round(Math.abs(de)) !== Math.round(Math.abs(para)))
        acoes.push(`${Math.abs(para) > Math.abs(de) ? "aumentou" : "reduziu"} ${a}`
                 + ` de ${tam(de)} para ${tam(para)}`);
    });
    return { data:d, abertura:false, acoes };
  });

  return eventos.reverse();          // mais recente em cima
}

  await universo();

  app().innerHTML = `
  <h1 style="font-size:27px;margin:30px 0 6px">Criar carteira</h1>
  <p style="color:var(--t2);max-width:58ch;margin-bottom:20px">

  <div id="erro"></div>
  <div class="duplo">
    <form class="card" id="f">
      <label>Nome da carteira</label><input name="nome" required maxlength="40"
        placeholder="ex.: Dividendos que eu seguiria">
      <label>O que você está estudando aqui</label><input name="descricao" maxlength="160">
      <label>Classe</label>
      <select name="classe" id="selClasse" required>
        <option value="">escolha a classe…</option>
        ${Object.entries(CLASSE).map(([k,v])=>`<option value="${k}">${v.nome}</option>`).join("")}
      </select>
      <p id="regraClasse" style="font-size:12px;color:var(--graf);margin:-3px 0 13px">
        A classe não muda depois de criada. A regra fica no quadro ao lado.</p>
      <label>Rebalanceamento</label>
      <select name="rebalancear" id="selReb">
        <option value="nunca">nunca — o peso corre solto</option>
        <option value="banda">por banda — refaz a carteira toda quando um papel se afastar</option>
        <option value="mensal">mensal</option>
        <option value="semanal">semanal</option>
        <option value="anual">anual</option>
      </select>
      <div id="campoRF" style="display:none">
        <label>Renda fixa, em % do dinheiro</label>
        <input id="rendaFixa" type="number" step="1" min="50" max="80" value="60">
        <p style="font-size:12px;color:var(--graf);margin:-11px 0 13px">
          De 50% a 80%. O que sobra vai para ações — e na grade abaixo você
          distribui <b>essa parte</b>, somando 100%.</p>
      </div>
      <div id="campoBanda" style="display:none">
        <label>Banda, em pontos percentuais</label>
        <input name="banda_pct" type="number" step="1" min="1" max="100" value="5">
      </div>
      <p style="font-size:12px;color:var(--graf);margin:-3px 0 13px">
        Assim como a classe, <b>não muda depois de criada</b> — poder ligar e
        desligar seria escolher a régua depois de ver o resultado.</p>
      <label>Posições</label>
      ${gradeHTML()}
      <label>Anotação desta mudança (opcional)</label><input name="nota" maxlength="200">
      <button class="bt cheio" id="bt">Criar carteira</button>
    </form>
    <div>
      <div class="card">
        <h3 style="font-size:15px;margin-bottom:9px" id="tituloAjuda">Como o peso funciona</h3>
        <div id="ajudaClasse"></div>
        <p style="font-size:12.5px;color:var(--t2);margin:0">
          Depois de criada, o peso <b>anda sozinho</b> com o mercado até você
          declarar mudança.</p>
        <details style="margin-top:12px">
          <summary style="cursor:pointer;font-size:12.5px;color:var(--graf)">Detalhes</summary>
          <p style="font-size:12.5px;color:var(--t2);margin:9px 0 0">
            O que não somar 100% nos comprados é caixa, e caixa rende CDI. Venda a
            descoberto entra dinheiro: 130 comprado e 40 vendido dá 10% de caixa,
            não −30%. Os limites entram: exatamente 100% é aceito.</p>
          <p style="font-size:12.5px;color:var(--t2);margin:9px 0 0">
            <b>Rebalancear</b> devolve os pesos ao que você declarou. Na banda, basta
            <b>um</b> papel se afastar mais que o limite para a carteira <b>inteira</b>
            voltar ao declarado. A banda é em pontos: 3 pontos numa posição de 10%
            dispara com alguma frequência; 5 pontos, quase nunca.</p>
          <p style="font-size:12.5px;color:var(--t2);margin:9px 0 0">
            Se a carteira perder tudo, ela é encerrada e sai do ranking.</p>
        </details>
      </div>
      ${minhas?.length?`<details class="card" style="margin-top:13px">
        <summary style="cursor:pointer;font-size:15px;font-weight:600">Suas carteiras
          <span style="color:var(--graf);font-weight:400">· ${minhas.length}</span></summary>
        <div style="height:9px"></div>
        ${minhas.map(c=>`<div style="padding:6px 0;border-bottom:1px solid var(--p3)">
          <a href="#/carteira/${c.id}">${esc(c.nome)}</a>
          <span style="font-size:11px;color:var(--graf)">· desde ${c.criada_em}</span></div>`).join("")}
      </div>`:""}
    </div>
  </div>`;

  ligarGrade([["","","C"]], "");

  // Vira true no primeiro clique, para o segundo publicar de verdade.
  // Mora AQUI, na tela que usa. Estava em telaEntrar, e por isso o
  // botao Registrar morria calado num ReferenceError.
  let confirmado = false;
  $("#f").oninput = () => {
    if(confirmado){                       // mexeu depois de conferir: confere de novo
      confirmado = false;
      $("#bt").textContent = "Criar carteira";
      $("#erro").innerHTML = "";
    }
  };

  // Mensagem de erro rola ate a vista. O #erro fica no topo de um
  // formulario longo: sem isto, o aviso aparece fora da tela e o clique
  // parece nao ter feito nada.
  const erroPub = t => {
    const el = $("#erro");
    el.innerHTML = aviso(t, true);
    el.scrollIntoView({ behavior:"smooth", block:"center" });
  };

  $("#selClasse").onchange = e => {
    const v = CLASSE[e.target.value];
    $("#regraClasse").innerHTML = v
      ? `Classe <b>${v.nome}</b> — não muda depois de criada. A regra está no quadro ao lado.`
      : "A classe não muda depois de criada. A regra fica no quadro ao lado.";
    // o painel lateral fala da classe escolhida, não de regra genérica
    $("#tituloAjuda").textContent = v ? `Classe ${v.nome}` : "Como o peso funciona";
    $("#ajudaClasse").innerHTML = v
      ? `<p style="font-size:12.5px;color:var(--t2);margin:0 0 9px">${v.regra}</p>`
      : "";
    // A grade passa a oferecer só os lados que a classe aceita. Se ainda
    // não há nenhum código digitado, ela também já vem montada no formato
    // da classe — 10 linhas de 10% na Comprada, por exemplo. Se a pessoa
    // já digitou algo, não mexemos: apagar o trabalho dela seria pior.
    CLASSE_ATUAL = e.target.value || "";
    const vazia = ![...document.querySelectorAll("#linhas .pa")]
      .some(i => (i.value||"").trim());
    const molde = {
      diversificada:     Array.from({length:10}, ()=>["",10,"C"]),
      sessenta_quarenta: Array.from({length:4},  ()=>["",25,"C"]),
      long_short:        [["",50,"C"],["",50,"C"],["",50,"V"]],
      vendida:           [["",50,"V"],["",50,"V"]],
    }[CLASSE_ATUAL];
    $("#campoRF").style.display = CLASSE_ATUAL === "sessenta_quarenta" ? "block" : "none";
    if(vazia && molde) ligarGrade(molde, CLASSE_ATUAL);
    else aplicarLados();
    resumoGrade();
  };
  $("#rendaFixa").oninput = resumoGrade;

  // a banda so faz sentido na modalidade banda
  $("#selReb").onchange = e => {
    $("#campoBanda").style.display = e.target.value === "banda" ? "block" : "none";
  };

  $("#f").onsubmit = async e=>{
    e.preventDefault();
    const f = new FormData(e.target), bt = $("#bt");
    let pesos = lerGrade();
    if(!Object.keys(pesos).length) return erroPub("Nenhuma posição válida — preencha código e peso.");

    if(!f.get("classe")) return erroPub(
      "Escolha a classe da carteira. Ela define contra quem você é comparado e não muda depois.");

    // As regras da classe conferidas AQUI, antes de ir ao banco, para o
    // motivo chegar em portugues e nao como excecao do Postgres.
    const falta = pendenciasClasse(f.get("classe"), pesos);
    if(falta.length) return erroPub(
      `Esta carteira ainda não cabe na classe ${CLASSE[f.get("classe")].nome}: ` + falta.join("; ") + ".");

    // na 60/40 o que foi digitado e % da parte de acoes: converte para
    // % do dinheiro antes de qualquer coisa que va ao banco
    const rfEscolhida = rendaFixaAtual();
    if(f.get("classe") === "sessenta_quarenta" && modoSleeve())
      pesos = converterSleeve(pesos, rfEscolhida);

    const bruta = Object.values(pesos).reduce((a,b)=>a+Math.abs(b),0);

    const { data:uni } = await sb.from("universo").select("ativo").in("ativo", Object.keys(pesos));
    const ok = new Set((uni||[]).map(x=>x.ativo));
    const fora = Object.keys(pesos).filter(a=>!ok.has(a));
    if(fora.length) return erroPub(
      "Não achei no universo: "+fora.join(", ")+". Ou o código está errado, ou o papel não tem liquidez mínima, ou o universo ainda não foi atualizado.");

    // ── confirmação antes de publicar ──
    // A classe não muda depois de criada e o histórico começa aqui, então
    // vale um segundo olhar. O primeiro clique mostra o resumo; o segundo
    // publica de verdade.
    if(!confirmado){
      const cl = CLASSE[f.get("classe")];
      const lista = Object.entries(pesos).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]));
      const liq = Object.values(pesos).reduce((a,b)=>a+b,0);
      $("#erro").innerHTML = `
      <div class="card" style="border-color:var(--lacre);margin-bottom:16px">
        <div style="font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--graf);margin-bottom:10px">
          Confira antes de publicar</div>
        <div style="font-size:19px;font-weight:600;margin-bottom:2px">${esc(f.get("nome").trim())}</div>
        <div style="font-size:12.5px;color:var(--t2);margin-bottom:12px">
          ${esc(f.get("descricao")||"sem descrição")}</div>
        <div style="margin-bottom:12px"><span class="tag">${cl.nome}</span>
          <span class="tag">${f.get("rebalancear")==="banda"
            ? `rebalanceia por banda de ${n2(Number(f.get("banda_pct")||5),0)} p.p.`
            : `rebalanceamento ${f.get("rebalancear")||"nunca"}`}</span></div>
        <table><tbody>${lista.map(([a,p])=>`<tr>
          <td class="mono" style="font-weight:500">${esc(a)}</td>
          <td class="d mono ${p<0?"baixa":""}">${p<0?"vendido":"comprado"} ${n2(Math.abs(p),0)}%</td>
        </tr>`).join("")}</tbody></table>
        <div style="font-size:12.5px;color:var(--t2);margin-top:11px">
          bruta <b>${n2(bruta,0)}%</b> · líquida <b>${n2(liq,0)}%</b> ·
          caixa <b>${n2(100-liq,0)}%</b> · ${lista.length} ${lista.length===1?"papel":"papéis"}</div>
        <p style="font-size:11.5px;color:var(--graf);margin:11px 0 0">
          A classe <b>não muda</b> depois de criada, e a carteira passa a valer
          a partir do próximo pregão. Publicar de novo com outro nome é sempre
          possível; mudar esta, não.</p>
      </div>`;
      confirmado = true;
      bt.textContent = "Confirmar e criar";
      $("#erro").scrollIntoView({ behavior:"smooth", block:"nearest" });
      return;
    }

    bt.disabled=true; bt.textContent="salvando…";

    // rebalancear e banda_pct sao imutaveis (trigger trava_classe), entao
    // este insert e a unica chance de defini-los
    const { data:c, error } = await sb.from("carteira").insert({
      usuario_id: eu.id, nome: f.get("nome").trim(),
      descricao: f.get("descricao")||"", classe: f.get("classe"),
      rebalancear: f.get("rebalancear") || "nunca",
      banda_pct: Math.min(100, Math.max(1, Math.round(Number(f.get("banda_pct")) || 5))) })
      .select().single();
    if(error){ bt.disabled=false; bt.textContent="Criar carteira";
      const m = error.message.includes("carteira_nome_unico")
        ? "Você já tem uma carteira com esse nome. Escolha outro."
        : error.message;
      return erroPub(m); }

    // Este insert é o que passa pelo porteiro da classe (valida_classe).
    // Antes o erro era engolido e a carteira ficava criada e VAZIA — foi
    // assim que nasceu uma "vendida" com quatro papéis comprados.
    const { error: errPos } = await sb.from("posicao").insert(
      Object.entries(pesos).map(([ativo,peso])=>({ carteira_id:c.id, ativo, peso })));

    if(errPos){
      // desfaz a carteira órfã, senão fica lixo na lista da pessoa
      await sb.from("carteira").delete().eq("id", c.id);
      bt.disabled=false; bt.textContent="Criar carteira"; confirmado=false;
      // se chegou aqui, valida_classe() do banco recusou algo que a tela
      // deixou passar — as duas listas de regra estao fora de sincronia
      return erroPub("O banco recusou as posições: " + errPos.message);
    }

    if(f.get("nota")) await sb.from("nota").insert({ carteira_id:c.id, texto:f.get("nota") });
    CACHE_CLASSE = null;        // carteira nova: o cache de classes envelheceu
    location.hash = "#/carteira/"+c.id; rotear();
  };
}

// ═══════════════════════════════════════════ carteira
async function telaCarteira(id){
  app().innerHTML = `<div class="carreg">carregando…</div>`;
  const { data:c } = await sb.from("ranking").select("*").eq("id", id).single();
  if(!c) return app().innerHTML = aviso("Carteira não encontrada.", true);
  const cl1 = (await classes())[id];
  if(cl1){ c.classe = cl1.classe; c.criada_em = cl1.criada_em;
           if(cl1.autor) c.apelido = cl1.autor; }

  const { data:serie } = await sb.from("retorno_dia").select("data,retorno,indice")
                                 .eq("carteira_id", id).order("data");
  const m = metricas(serie);
  // se as regras do banco liberarem, vem; senão volta vazio — é o lacre funcionando
  const { data:pesos } = await sb.from("peso_atual").select("ativo,peso,marco").eq("carteira_id", id);
  // o declarado da mesma data que está carregada: é a referência de
  // como a carteira começou, antes de o peso andar com o mercado
  const marcoAtual = pesos?.[0]?.marco;
  let declarado = {};
  if(marcoAtual){
    const { data:dec } = await sb.from("posicao").select("ativo,peso")
      .eq("carteira_id", id).eq("valida_de", marcoAtual);
    (dec||[]).forEach(d=> declarado[d.ativo] = d.peso);
  }
  const { data:notas } = await sb.from("nota").select("data,texto")
                                 .eq("carteira_id", id).order("data",{ascending:false}).limit(8);
  // todas as declaracoes, para o extrato. Vem vazio para quem nao tem
  // acesso: a RLS que protege o peso protege isto tambem.
  const { data:todasPos } = await sb.from("posicao").select("ativo,peso,valida_de")
                                    .eq("carteira_id", id).order("valida_de");
  const extrato = montarExtrato(todasPos);
  let sigo=false, nSeg=0;
  if(eu){
    const { data:sg } = await sb.from("seguidor").select("carteira_id")
        .eq("carteira_id", id).maybeSingle();
    sigo = !!sg;
  }
  try{
    const { data:cont } = await sb.rpc("seguidores_por_carteira");
    nSeg = (cont||[]).find(x=>String(x.carteira_id)===String(id))?.n || 0;
  }catch(e){ nSeg = 0; }
  const podeSeguir = !!eu?.assinante;
  const meu = eu && c.apelido === eu.apelido;
  // Quem pode ver: dono, assinante ou admin. A consulta só devolve
  // linha se for o dono, então ela não revela autor de carteira
  // anônima para mais ninguém.
  let souDono = false;
  if(eu){
    const { data:d } = await sb.from("carteira").select("id")
      .eq("id", id).eq("usuario_id", eu.id).maybeSingle();
    souDono = !!d;
  }
  const podeVer = !!(eu && (souDono || eu.assinante || eu.admin));

  // "Sem posição" e "sem permissão" são coisas diferentes. Antes as
  // duas caíam no cadeado, e o dono era convidado a assinar a própria
  // carteira.
  const abre = pesos && pesos.length;
  const maxp = abre ? Math.max(...pesos.map(p=>Math.abs(p.peso))) : 1;
  const esc100 = Math.max(c.bruta,100)*1.06;

  app().innerHTML = `
  <div style="margin:28px 0 4px">
    <h1 style="font-size:29px">${esc(c.nome)}</h1>
    <div style="margin:8px 0">${tags(c)}${nSeg>=3
      ? `<span class="tag">${nSeg} acompanhando</span>` : ""}</div>
    ${eu && !meu ? `<button class="bt ${sigo?"lacre":""}" id="btSino" style="margin:2px 0 6px">
      ${sigo ? "acompanhando · avisar quando mudar"
             : podeSeguir ? "acompanhar mudanças"
                          : "acompanhar mudanças · assinante"}</button>` : ""}
    ${c.descricao?`<p style="color:var(--t2);font-style:italic;max-width:60ch">“${esc(c.descricao)}”</p>`:""}
    <p style="font-size:12px;color:var(--graf)">${esc(c.apelido)}
      · publicada em ${c.criada_em}</p>
  </div>
  <div class="grade">
    <div class="cel"><div class="v ${cor(m.hoje)}">${pct(m.hoje)}</div><div class="k">hoje</div></div>
    <div class="cel"><div class="v ${cor(m.acum)}">${pct(m.acum)}</div><div class="k">acumulado</div></div>
    <div class="cel"><div class="v">${n2(m.sharpe)}</div><div class="k">sharpe</div></div>
    <div class="cel"><div class="v baixa">${pct(m.dd)}</div><div class="k">queda máxima</div></div>
    <div class="cel"><div class="v">${pct(m.vol,1)}</div><div class="k">oscilação a.a.</div></div>
    <div class="cel"><div class="v">${m.dias}</div><div class="k">dias</div></div>
  </div>
  <div class="card" style="margin-bottom:18px">
    <div style="font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--graf);margin-bottom:9px">

    <div class="barra">
      <span style="background:var(--alta-bg);width:${((c.bruta+c.liquida)/2/esc100*100).toFixed(1)}%"></span>
      <span style="background:var(--baixa-bg);width:${((c.bruta-c.liquida)/2/esc100*100).toFixed(1)}%"></span>

    </div>
    <div style="position:relative;height:13px;margin-top:2px">
      <span style="position:absolute;left:${(100/esc100*100).toFixed(1)}%;transform:translateX(-50%);
        font-family:'IBM Plex Mono';font-size:9px;color:var(--lacre)">100%</span>
    </div>
    <div style="font-size:11.5px;color:var(--t2);margin-top:7px">
      comprado ${n2((c.bruta+c.liquida)/2,0)}% ·
      vendido ${n2((c.bruta-c.liquida)/2,0)}% ·
      <b>bruta ${n2(c.bruta,0)}%</b> · <b>líquida ${n2(c.liquida,0)}%</b> ·
      caixa ${n2(c.caixa,0)}%</div>
  </div>
  ${abre ? `<div class="card">
    <div style="font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--graf);margin-bottom:10px">
      Papéis e pesos${marcoAtual?` · declarado em ${marcoAtual}`:""}</div>
    <table><thead><tr><th></th><th></th>
      <th class="d" style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--graf)">declarado</th>
      <th class="d" style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--graf)">atual</th>
      <th class="d" style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--graf)">diferença</th></tr></thead>
    <tbody>${pesos.sort((a,b)=>Math.abs(b.peso)-Math.abs(a.peso)).map(p=>{

      const dif = d==null ? null : Math.abs(p.peso) - Math.abs(d);
      return `<tr><td class="mono" style="font-weight:500">${esc(p.ativo)}</td>
      <td><span style="display:block;height:5px;width:${(Math.abs(p.peso)/maxp*100).toFixed(0)}%;

      <td class="d mono" style="color:var(--graf);font-size:12px">${d==null?"—":n2(d)+"%"}</td>

    <p style="font-size:11.5px;color:var(--graf);margin:9px 0 0">
      O peso anda sozinho: quem sobe mais que a carteira ganha espaço.
      <b>Declarado</b> é o que foi registrado na data acima, <b>atual</b> é onde

    ${extrato.length > 1 ? `<div style="margin-top:20px">
      <div style="font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--graf);margin-bottom:9px">
        Extrato · ${extrato.length} ${extrato.length===1?"declaração":"declarações"}</div>
      ${extrato.map(e=>`<div style="padding:9px 0;border-bottom:1px solid var(--p3)">

// ═══════════════════════════════════════════ duelo
async function telaDuelo(){
  const { data:cs } = await sb.from("ranking").select("*");
  const ids = (cs||[]).map(c=>c.id);
  let series={};
  if(ids.length){
    const { data:rs } = await sb.from("retorno_dia").select("carteira_id,data,retorno,indice")
                                .in("carteira_id", ids).order("data");
    (rs||[]).forEach(r=>{ (series[r.carteira_id] ||= []).push(r); });
  }
  const l = (cs||[]).map(c=>({c,m:metricas(series[c.id])})).sort((a,b)=>b.m.hoje-a.m.hoje);

  // monta os pares: 1º contra último, 2º contra penúltimo, e assim por diante
  const pares=[];
  for(let a=0,b=l.length-1; a<b; a++,b--) pares.push([l[a],l[b]]);

  const lado = (x,venceu) => `
    <div style="flex:1;min-width:0;padding:16px 18px;border-radius:3px;
      background:${venceu?"rgba(201,162,39,.09)":"transparent"};
      border:1px solid ${venceu?"var(--lacre)":"var(--linha)"}">
      <a href="#/carteira/${x.c.id}" style="font-family:Newsreader,serif;font-size:17px">${esc(x.c.nome)}</a>
      <div style="font-size:11px;color:var(--graf);margin:3px 0 9px">${esc(x.c.apelido)}</div>
      <div class="mono ${cor(x.m.hoje)}" style="font-size:25px;font-weight:500">${pct(x.m.hoje)}</div>
      <div style="margin-top:8px">${tags(x.c)}</div>
    </div>`;

  app().innerHTML = `
  <h1 style="font-size:27px;margin:30px 0 6px">Duelo do dia</h1>
  <p style="color:var(--t2);max-width:58ch;margin-bottom:22px">
    Primeiro contra último, segundo contra penúltimo, e assim por diante.
    Vale o retorno de hoje. Sem aposta — vale ponto.</p>
  ${l.length<2 ? `<div class="card" style="text-align:center;padding:34px">
      Precisa de pelo menos duas carteiras publicadas para haver duelo.</div>`
  : pares.map((p,i)=>{
      const [a,b]=p, ea=a.m.hoje, eb=b.m.hoje;
      const emp = Math.abs(ea-eb) < 1e-9;
      return `<div style="margin-bottom:14px">
        <div style="font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
          color:var(--graf);margin-bottom:7px">Duelo ${i+1}${
          emp?" \u00b7 empate":` \u00b7 ${(Math.abs(ea-eb)*100).toFixed(2).replace(".",",")} pontos de diferen\u00e7a`}</div>
        <div style="display:flex;gap:12px;align-items:stretch;flex-wrap:wrap">
          ${lado(a, !emp && ea>eb)}
          <div style="display:grid;place-items:center;color:var(--lacre);
            font-family:Newsreader,serif;font-size:15px;padding:0 4px">contra</div>
          ${lado(b, !emp && eb>ea)}
        </div></div>`;
    }).join("")
  }
  ${l.length%2 ? `<p style="color:var(--graf);font-size:12.5px;margin-top:14px">
    <b>${esc(l[Math.floor(l.length/2)].c.nome)}</b> ficou sem par \u2014 n\u00famero \u00edmpar de carteiras.</p>`:""}
  ${l.length>=2 ? `<p style="color:var(--graf);font-size:12.5px;margin-top:16px">
    ${l.length} carteiras no p\u00e1reo. Os pares mudam todo dia conforme o resultado.</p>`:""}`;
}

    <div class="cel"><div class="v">${(cts||[]).filter(c=>c.ativa).length}</div><div class="k">carteiras</div></div>
    <div class="cel"><div class="v">${nu||0}</div><div class="k">universo</div></div>
    <div class="cel"><div class="v" style="font-size:13px">${dias?.[0]?.data||"—"}</div><div class="k">último fechamento</div></div>
    <div class="cel"><div class="v">${fila.length}</div><div class="k">e-mails na fila</div></div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <h3 style="font-size:15px;margin-bottom:6px">Robô diário</h3>
    <p style="font-size:11.5px;color:var(--graf);margin:0">
      Roda sozinho no GitHub Actions, 19h em dias úteis. Os botões que ficavam aqui
      raspavam o Fundamentus, que recusa conexão de datacenter desde julho/2026.
      Para rodar à mão: Actions &rarr; Fechar o dia &rarr; Run workflow.</p>
  </div>

  <details class="card" style="margin-bottom:16px" open>
    <summary style="cursor:pointer;font-size:15px;font-weight:600">
      Carteiras <span style="color:var(--graf);font-weight:400">· ${(cts||[]).length}</span></summary>
    <div style="margin:12px 0 10px">
      <span style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--graf);margin-right:8px">ordenar</span>
      <button class="bt ord" data-ord="recente" style="padding:3px 10px;font-size:12px">recente</button>
      <button class="bt ord" data-ord="nome"    style="padding:3px 10px;font-size:12px;margin-left:5px">nome</button>
      <button class="bt ord" data-ord="dono"    style="padding:3px 10px;font-size:12px;margin-left:5px">dono</button>
      <button class="bt ord" data-ord="total"   style="padding:3px 10px;font-size:12px;margin-left:5px">acumulado</button>
    </div>
    <table><thead><tr><th>Nome</th><th>Dono</th><th class="d">Acum.</th><th class="d">Ações</th></tr></thead>
    <tbody id="tbCart"></tbody></table>
  </details>

  <details class="card">
    <summary style="cursor:pointer;font-size:15px;font-weight:600">

    <table style="margin-top:12px"><thead><tr><th>Apelido</th><th>E-mail</th><th class="d">Assinatura</th><th class="d">Ações</th></tr></thead><tbody>

    log(msg); telaAdmin();
  };

  document.querySelectorAll("[data-uid]").forEach(b=>{
    if(b.classList.contains("ac-ape") || b.classList.contains("ac-blo")) return;
    b.onclick = async()=>{
      b.disabled = true;
      const { error } = await sb.rpc("definir_assinante",
        { quem: b.dataset.uid, valor: b.dataset.ass!=="1" });
      if(error){ b.disabled=false; return log("falhou: "+error.message); }
      telaAdmin();
    };
  });

  });

  document.querySelectorAll(".ac-blo").forEach(b=> b.onclick = ()=>{

    if(bloquear && !confirm("Bloquear esta conta? Ela sai do ranking e não entra mais.")) return;

      bloquear?"Conta bloqueada.":"Conta liberada.");

        style="padding:4px 10px;font-size:12px">renomear</button>

        style="padding:4px 10px;font-size:12px;margin-left:5px;border-color:var(--baixa);color:var(--baixa)">apagar</button>`:""}
    </td></tr>`;

  const ligarCart = () => {
    document.querySelectorAll(".ac-del").forEach(b=> b.onclick = ()=>{
      if(!confirm(`Apagar "${b.dataset.nome}"? Ela sai do ranking. O histórico fica guardado.`)) return;
      chamar("admin_apagar_carteira", { cid:Number(b.dataset.cid) }, "Carteira apagada.");
    });
    document.querySelectorAll(".ac-ren").forEach(b=> b.onclick = ()=>{
      const n = prompt("Novo nome da carteira:", b.dataset.nome);

      chamar("admin_renomear_carteira",
        { cid:Number(b.dataset.cid), novo_nome:n.trim(), nova_desc:null }, "Nome trocado.");
    });
  };

  const pintarCart = (o="recente") => {
    const l = [...(cts||[])];   // "recente" já vem ordenado da consulta
    if(o==="nome")  l.sort((a,b)=> a.nome.localeCompare(b.nome,"pt-BR"));
    if(o==="dono")  l.sort((a,b)=>
      (apelidoDe[a.usuario_id]||"").localeCompare(apelidoDe[b.usuario_id]||"","pt-BR")
      || a.nome.localeCompare(b.nome,"pt-BR"));

    $("#tbCart").innerHTML = l.map(linhaCart).join("");
    document.querySelectorAll(".ord").forEach(x=>
      x.classList.toggle("cheio", x.dataset.ord===o));
    ligarCart();
  };

  document.querySelectorAll(".ord").forEach(b=>
    b.onclick = ()=> pintarCart(b.dataset.ord));
  pintarCart();
}

    <label>Senha nova</label><input type="password" id="s1" minlength="6">
    <label>Repita a senha nova</label><input type="password" id="s2" minlength="6">
    <button class="bt cheio" id="btSenha">Trocar senha</button>
  </div>`;

  // ── como você aparece ──
  $("#selExibir").value = eu.exibir || "apelido";
  $("#nomePublico").value = eu.nome_publico || "";
  const mostraCampo = () => {
    $("#campoNome").style.display = $("#selExibir").value === "nome" ? "" : "none";
  };
  mostraCampo();
  $("#selExibir").onchange = mostraCampo;

  $("#btExibir").onclick = async () => {
    const modo = $("#selExibir").value;
    const nome = $("#nomePublico").value.trim();
    if(modo === "nome" && !nome)
      return $("#erro").innerHTML = aviso("Escreva o nome que você quer que apareça.", true);

    const { error } = await sb.from("perfil")
      .update({ exibir: modo, nome_publico: nome || null }).eq("id", eu.id);
    if(error) return $("#erro").innerHTML = aviso(error.message, true);

    eu.exibir = modo; eu.nome_publico = nome || null;
    CACHE_CLASSE = null;              // o autor mudou: refaz o cache
    $("#erro").innerHTML = aviso("Pronto. É assim que você aparece agora.");
  };


  $("#btSenha").onclick = async()=>{
    const a=$("#s1").value, b=$("#s2").value;
    if(a.length<6) return $("#erro").innerHTML=aviso("A senha precisa de pelo menos 6 caracteres.",true);
    if(a!==b)      return $("#erro").innerHTML=aviso("As duas senhas não são iguais.",true);
    const { error } = await sb.auth.updateUser({ password:a });
    $("#erro").innerHTML = error ? aviso(error.message,true) : aviso("Senha trocada.");
    $("#s1").value=$("#s2").value="";
  };
  ligarApagarMinhas();
}

function ligarApagarMinhas(){
  document.querySelectorAll(".del-minha").forEach(b=> b.onclick = async()=>{
    // O front já sabe se a carteira tem dias apurados, então dá para
    // dizer a verdade ANTES de a pessoa confirmar — apagar de vez e
    // encerrar são coisas diferentes.
    const temDias = Number(b.dataset.dias||0) > 0;
    const texto = temDias
      ? `Encerrar "${b.dataset.nome}"?\n\nEla já tem ${b.dataset.dias} pregão(ões) apurado(s), `
        + `então o histórico NÃO é apagado: ela sai do ranking, para de contar e a `
        + `curva fica congelada, visível por link.\n\nNão dá para reabrir depois.`
      : `Apagar "${b.dataset.nome}" de vez?\n\nEla nunca foi apurada, então some por `
        + `inteiro: posições, anotações e seguidores. Não fica nada.`;
    if(!confirm(texto)) return;
    b.disabled = true;
    const { data:oque, error } = await sb.rpc("apagar_carteira", { cid:Number(b.dataset.cid) });
    if(error){ b.disabled=false; return alert(error.message); }
    if(oque === "encerrada") alert("Encerrada. A página dela continua acessível por link.");
    telaConta();
  });
}

async function telaEditar(id){
  if(!eu){ location.hash="#/entrar"; return rotear(); }
  const { data:c } = await sb.from("carteira").select("*").eq("id",id).single();
  if(!c || c.usuario_id!==eu.id) return app().innerHTML=aviso("Essa carteira não é sua.",true);

  const { data:pos } = await sb.from("posicao").select("ativo,peso,valida_de")
      .eq("carteira_id",id).order("valida_de",{ascending:false});
  const { data:serie } = await sb.from("retorno_dia").select("data,retorno,indice")
      .eq("carteira_id",id).order("data",{ascending:false});
  await universo();

  // declarações agrupadas por data
  const decl={}; (pos||[]).forEach(p=>{ (decl[p.valida_de] ||= []).push(p); });
  const datas=Object.keys(decl).sort().reverse();
  const atual=datas.length?decl[datas[0]]:[];
  const texto=atual.map(p=>`${p.ativo} ${n2(Math.abs(p.peso))} ${p.peso<0?"V":"C"}`).join("\n");

  app().innerHTML = `
  <h1 style="font-size:27px;margin:30px 0 4px">Editar carteira</h1>
  <p style="color:var(--t2);margin-bottom:18px">${esc(c.nome)}</p>
  <div id="erro"></div>
  <div class="duplo">
    <div>
      <div class="card">
        <h3 style="font-size:16px;margin-bottom:14px">Nome e descrição</h3>
        <label>Nome</label><input id="nome" maxlength="40" value="${esc(c.nome)}">
        <label>Descrição</label><input id="desc" maxlength="160" value="${esc(c.descricao||"")}">
        <button class="bt cheio" id="btNome">Salvar</button>
      </div>
      <div class="card" style="margin-top:16px">
        <h3 style="font-size:16px;margin-bottom:8px">Declarar novas posições</h3>
        <p style="font-size:12px;color:var(--t2);margin:0 0 14px">
          Isso cria uma declaração de hoje. As de dias anteriores ficam guardadas —
          é o histórico que mostra quando você mudou de ideia.</p>
        <label>Posições</label>
        ${gradeHTML()}
        <label>Por que você mudou (fica visível para assinantes)</label>
        <input id="nota" maxlength="200" placeholder="reduzi porque ficou caro demais">
        <button class="bt cheio" id="btPos">Declarar</button>
      </div>
      <div class="card" style="margin-top:16px;border-color:rgba(242,104,95,.35)">
        <h3 style="font-size:16px;margin-bottom:8px">Apagar</h3>
        <p style="font-size:12px;color:var(--t2);margin:0 0 12px">
          Sai do ranking e libera o nome. O histórico de retorno fica guardado.</p>
        <button class="bt" id="btDel" style="border-color:var(--baixa);color:var(--baixa)">Apagar carteira</button>
      </div>
    </div>
    <div>
      <div class="card">
        <h3 style="font-size:16px;margin-bottom:12px">Dia a dia</h3>
        ${!serie?.length?`<p style="color:var(--graf);font-size:13px;margin:0">
          Ainda não houve nenhum fechamento.</p>`
        :`<table><thead><tr><th>Data</th><th class="d">No dia</th>
          <th class="d">Acumulado</th></tr></thead><tbody>
          ${serie.slice(0,40).map(r=>`<tr><td class="mono" style="font-size:12px">${r.data}</td>
            <td class="d mono ${cor(r.retorno)}">${pct(r.retorno)}</td>
            <td class="d mono ${cor(r.indice/100-1)}">${pct(r.indice/100-1)}</td></tr>`).join("")}
        </tbody></table>`}
      </div>
      <div class="card" style="margin-top:16px">
        <h3 style="font-size:16px;margin-bottom:12px">Histórico de declarações</h3>
        ${datas.map(d=>`<div style="padding:9px 0;border-bottom:1px solid var(--linha)">
          <div class="mono" style="font-size:11.5px;color:var(--lacre)">${d}</div>
          <div style="font-size:12.5px;color:var(--t2);margin-top:3px">
            ${decl[d].map(p=>`${esc(p.ativo)} ${n2(p.peso)}%`).join(" · ")}</div>
        </div>`).join("")}
      </div>
    </div>
  </div>`;

  ligarGrade((atual||[]).map(p=>[p.ativo, Math.round(Math.abs(p.peso)), p.peso<0?"V":"C"]), c.classe);

  $("#btNome").onclick = async()=>{
    const { error } = await sb.rpc("renomear_carteira",
      { cid:id, novo_nome:$("#nome").value, nova_desc:$("#desc").value });
    if(error) return $("#erro").innerHTML=aviso(error.message,true);
    $("#erro").innerHTML=aviso("Salvo."); telaEditar(id);
  };
  $("#btPos").onclick = async()=>{
    const pesos = Object.entries(lerGrade()).map(([ativo,peso])=>({ ativo, peso }));
    if(!pesos.length) return $("#erro").innerHTML=aviso("Nenhuma posição válida.",true);
    const { data:uni } = await sb.from("universo").select("ativo")
        .in("ativo", pesos.map(p=>p.ativo));
    const ok=new Set((uni||[]).map(x=>x.ativo));
    const fora=pesos.filter(p=>!ok.has(p.ativo)).map(p=>p.ativo);
    if(fora.length) return $("#erro").innerHTML=aviso("Não achei no universo: "+fora.join(", "),true);
    const { error } = await sb.rpc("declarar",
      { cid:id, pesos, nota_txt:$("#nota").value||null });
    if(error) return $("#erro").innerHTML=aviso(error.message,true);
    $("#erro").innerHTML=aviso("Declarado. Passa a valer no próximo pregão."); telaEditar(id);

  $("#btDel").onclick = async()=>{
    const temDias = (dias||[]).length > 0;

      : `Apagar "${c.nome}" de vez?\n\nNunca foi apurada, então some por inteiro.`)) return;
    const { error } = await sb.rpc("apagar_carteira", { cid:id });
    if(error) return $("#erro").innerHTML=aviso(error.message,true);
    location.hash="#/conta"; rotear();
  };
}

// ═══════════════════════════════════════════ especuladores
// A outra metade do site. Aqui a pessoa escolhe papel e direção para o
// PRÓXIMO pregão; stop e alvo o sistema propõe pela volatilidade do
// próprio papel. Entrada na abertura, saída por stop, alvo ou
// fechamento. O placar é por DIA, não por operação — quem entra com 10
// papéis não leva vantagem sobre quem entra com 1.

async function telaApostar(){
  if(!eu){ location.hash="#/entrar"; return rotear(); }
  app().innerHTML = `<div class="carreg">carregando…</div>`;

  const { data:prox } = await sb.rpc("proximo_pregao");
  const [uni, mins] = await Promise.all([
    universo(),
    sb.from("aposta").select("id,ativo,direcao").eq("data", prox).order("id"),
  ]);
  const pend = mins.data || [];

  app().innerHTML = `
  <h1 style="font-size:31px;margin-bottom:6px">Palpite do pregão</h1>
  <p style="color:var(--t2);max-width:62ch;margin-bottom:22px">
    Escolha o papel e o lado para o pregão de <b>${prox}</b>. Você entra na
    abertura e sai no stop, no alvo ou no fechamento — o que vier primeiro.
    Até 10 papéis por pregão, e ninguém vê o seu palpite antes de o prazo
    fechar.</p>

  <div class="grid2">
    <div>
      <div class="card">
        <h3 style="font-size:15px;margin-bottom:12px">Novo palpite</h3>
        <div id="erro"></div>

        <label>Papel</label>
        <input id="apAtivo" list="uni" maxlength="8" placeholder="PETR4"
               style="text-transform:uppercase">
        <datalist id="uni">${uni.map(a=>`<option value="${a}">`).join("")}</datalist>

        <label>Lado</label>
        <select id="apDir">
          <option value="C">Compra — aposto que sobe</option>
          <option value="V">Venda — aposto que cai</option>
        </select>

        <div id="apLimites" style="font-size:12.5px;color:var(--t2);margin:4px 0 14px"></div>

        <button class="bt cheio" id="apBt" ${pend.length>=10?"disabled":""}>
          ${pend.length>=10?"limite de 10 atingido":"Registrar palpite"}</button>
      </div>

      <div class="card" style="margin-top:14px">
        <h3 style="font-size:15px;margin-bottom:5px">Como é apurado</h3>
        <p style="font-size:12.5px;color:var(--t2);margin:0 0 8px">
          Stop e alvo saem da <b>amplitude média do próprio papel</b>, não de uma
          porcentagem fixa. Sem isso, papel agitado bateria alvo por ruído e papel
          parado não bateria nem quando você acertasse a direção.</p>
        <p style="font-size:12.5px;color:var(--t2);margin:0 0 8px">
          <b>alvo +2 · fechamento a favor +1 · fechamento contra −1 · stop −2.</b>
          Se stop e alvo forem tocados no mesmo dia, o candle não diz qual veio
          primeiro: conta o fechamento, e vale ±1.</p>
        <p style="font-size:12.5px;color:var(--t2);margin:0">
          Se o papel abrir além do seu stop, você sai na abertura. Stop não é
          promessa de preço.</p>
      </div>
    </div>

    <div>
      <div class="card">
        <h3 style="font-size:15px;margin-bottom:4px">Seus palpites para ${prox}
          <span style="color:var(--graf);font-weight:400">· ${pend.length}/10</span></h3>
        <p style="font-size:11.5px;color:var(--graf);margin:0 0 12px">
          Dá para desistir enquanto o pregão não chegar.</p>
        ${pend.length ? `<table><tbody>${pend.map(p=>`<tr>
          <td class="mono" style="font-weight:500">${esc(p.ativo)}</td>
          <td class="${p.direcao==="V"?"baixa":"alta"}" style="font-size:12.5px">
            ${p.direcao==="V"?"venda":"compra"}</td>
          <td class="d"><button class="bt ap-del" data-id="${p.id}"
            style="padding:3px 9px;font-size:11.5px;border-color:var(--baixa);color:var(--baixa)">
            desistir</button></td></tr>`).join("")}</tbody></table>`
        : `<p style="font-size:12.5px;color:var(--graf);margin:0">Nenhum ainda.</p>`}
      </div>
      <div style="margin-top:14px"><a href="#/placar" class="bt">Ver o placar &rarr;</a></div>
    </div>
  </div>`;

  const mostrarLimites = async () => {
    const a = $("#apAtivo").value.trim().toUpperCase();
    const cx = $("#apLimites");
    if(!a || !UNISET.has(a)){ cx.innerHTML = ""; return; }
    const { data:l } = await sb.rpc("limites_sugeridos", { p_ativo: a });
    const r = l && l[0];
    if(!r){ cx.innerHTML = `<span style="color:var(--graf)">sem histórico deste papel ainda</span>`; return; }
    const dir = $("#apDir").value;
    cx.innerHTML = `Amplitude média de <b>${esc(a)}</b>: ${n2(r.amplitude*100)}% ao dia.
      Stop e alvo a <b>${n2(r.stop_pct*100)}%</b> da abertura, para
      ${dir==="V"?"cima e para baixo":"baixo e para cima"}.`;
  };
  $("#apAtivo").oninput = mostrarLimites;
  $("#apDir").onchange  = mostrarLimites;

  $("#apBt").onclick = async () => {
    const a = $("#apAtivo").value.trim().toUpperCase();
    if(!a) return $("#erro").innerHTML = aviso("Escolha um papel.", true);
    if(!UNISET.has(a)) return $("#erro").innerHTML = aviso(`${a} não está no universo.`, true);
    const { error } = await sb.from("aposta")
      .insert({ data: prox, ativo: a, direcao: $("#apDir").value });
    if(error) return $("#erro").innerHTML = aviso(error.message, true);
    telaApostar();
  };

  document.querySelectorAll(".ap-del").forEach(b => b.onclick = async () => {
    await sb.from("aposta").delete().eq("id", Number(b.dataset.id));
    telaApostar();
  });
}

      <th class="d">Retorno</th><th class="d">Pontos</th></tr></thead>
      <tbody>${minhas.map(p=>`<tr>
        <td class="mono" style="font-size:12px;color:var(--graf)">${p.data}</td>
        <td class="mono" style="font-weight:500">${esc(p.ativo)}</td>
        <td style="font-size:12.5px" class="${p.direcao==="V"?"baixa":"alta"}">
          ${p.direcao==="V"?"venda":"compra"}</td>
        <td style="font-size:12.5px;color:var(--t2)">${rotulo[p.tipo]||p.tipo}</td>
        <td class="d mono ${cor(p.retorno)}">${pct(p.retorno)}</td>
        <td class="d mono ${cor(p.pts)}"><b>${p.pts>0?"+":""}${p.pts}</b></td></tr>`).join("")}
      </tbody></table>`
    : `<div class="card"><p style="margin:0;color:var(--t2)">
        Nenhum palpite apurado ainda. <a href="#/apostar">Faça o primeiro</a>.</p></div>`}`
  : `<div class="card" style="margin-top:24px"><p style="margin:0;color:var(--t2)">
      <a href="#/entrar">Entre</a> para palpitar.</p></div>`}`;
}

function rotear(){
  const h = (location.hash||"#/").split("?")[0];
  const m = h.match(/^#\/carteira\/(\d+)$/);
  if(m)                       return telaCarteira(m[1]);
  if(h==="#/"||h==="")        return telaRanking();
  if(h==="#/entrar")          return telaEntrar();
  if(h==="#/publicar")        return telaPublicar();
  if(h==="#/duelo")           return telaDuelo();
  if(h==="#/apostar")         return telaApostar();
  if(h==="#/placar")          return telaPlacar();
  if(h==="#/comparar")        return telaComparar();
  if(h==="#/indicar")         return telaIndicar();
  if(h==="#/assinar")         return telaAssinar();
  if(h==="#/admin")           return telaAdmin();
  if(h==="#/conta")           return telaConta();
  if(h==="#/senha")           return telaSenha();
  if(h==="#/nova-senha")      return telaNovaSenha();
  const e = h.match(/^#\/editar\/(\d+)$/);
  if(e)                       return telaEditar(e[1]);
  telaRanking();
}
addEventListener("hashchange", rotear);

(async()=>{
  if(CHAVE.startsWith("COLE_AQUI")){
    app().innerHTML = `<div class="card" style="margin:40px 0">
      <h2 style="font-size:20px;margin-bottom:9px">Falta a chave</h2>
      <p style="color:var(--t2)">Abra este arquivo num editor de texto, procure a linha
      <b class="mono">const CHAVE =</b> lá no começo do script, e troque
      <b class="mono">COLE_AQUI_SUA_CHAVE_PUBLISHABLE</b> pela sua chave
      <b>publishable</b> do Supabase (a que começa com <b class="mono">sb_publishable_</b>).</p></div>`;
    return;
  }
  // se o link de recuperação trouxe sessão, manda escolher senha nova
  if(location.hash.includes("type=recovery")) location.hash = "#/nova-senha";
  await carregarEu(); pintarNav(); rotear();
  pintarFaixa();
  setInterval(pintarFaixa, 300000);
  sb.auth.onAuthStateChange(async()=>{ await carregarEu(); pintarNav(); });
})();
</script>
